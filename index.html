<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conway's Game of Life</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 40rem;
      margin: 0 auto;
      padding: 2rem 1rem;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>Conway's Game of Life</h1>
  <p>A Game of Life implementation in Rust.</p>
  <p id="wasm-status">Loading WebAssembly…</p>
  <script type="module">
    import init, { greet } from "./pkg/game_of_life.js";
    const status = document.getElementById("wasm-status");
    try {
      await init();
      status.textContent = "✅ Rust says: " + greet();
    } catch (e) {
      status.textContent = "❌ Failed to load WebAssembly: " + e;
    }
  </script>
</body>
</html>
