<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conway's Game of Life</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #050505;
      color: #d6d6d6;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      font-weight: 400;
      margin-bottom: 8px;
    }

    p {
      color: #888;
      font-size: 14px;
      margin-bottom: 24px;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 900px;
      height: auto;
      margin: 0 auto;
      background: #000;
      cursor: crosshair;
      image-rendering: pixelated;
      touch-action: manipulation;
    }

    button {
      margin-top: 20px;
      padding: 10px 18px;
      border: 1px solid #a65b20;
      background: #17110c;
      color: #f5a34d;
      font-size: 14px;
      cursor: pointer;
    }

    button:active {
      background: #332012;
    }
  </style>
</head>

<body>
  <h1>Conway's Game of Life</h1>
  <p>Click or tap the cells to create your own patterns.</p>

  <canvas
    id="grid"
    width="900"
    height="450"
    aria-label="Interactive Game of Life grid"
  ></canvas>

  <button id="clear">Clear grid</button>

  <script>
    const canvas = document.getElementById("grid");
    const ctx = canvas.getContext("2d");
    const clearButton = document.getElementById("clear");

    const cellSize = 5;
    const gap = 2;
    const step = cellSize + gap;

    const columns = Math.floor(canvas.width / step);
    const rows = Math.floor(canvas.height / step);

    const cells = new Set();

    function drawCell(x, y) {
      const color = Math.random() > 0.5
        ? "#ff9d42"
        : "#d97725";

      ctx.fillStyle = color;
      ctx.fillRect(
        x * step,
        y * step,
        cellSize,
        cellSize
      );
    }

    function render() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const key of cells) {
        const [x, y] = key.split(",").map(Number);
        drawCell(x, y);
      }
    }

    canvas.addEventListener("click", (event) => {
      const rect = canvas.getBoundingClientRect();

      const x = Math.floor(
        (event.clientX - rect.left) * canvas.width / rect.width / step
      );

      const y = Math.floor(
        (event.clientY - rect.top) * canvas.height / rect.height / step
      );

      if (x < 0 || x >= columns || y < 0 || y >= rows) {
        return;
      }

      const key = `${x},${y}`;

      if (cells.has(key)) {
        cells.delete(key);
      } else {
        cells.add(key);
      }

      render();
    });

    clearButton.addEventListener("click", () => {
      cells.clear();
      render();
    });

    render();
  </script>
</body>
</html>
