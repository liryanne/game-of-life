<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conway's Game of Life</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 12px;
      background: #050505;
      color: #eee;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      font-weight: 400;
    }

    p {
      color: #999;
      font-size: 14px;
    }

    #stats {
      margin: 18px 0;
      color: #f5a34d;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 900px;
      height: auto;
      margin: 0 auto;
      background: #000;
      cursor: crosshair;
      image-rendering: pixelated;
      touch-action: none;
    }

    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px auto;
    }

    button {
      padding: 10px 16px;
      border: 1px solid #a65b20;
      background: #17110c;
      color: #f5a34d;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #332012;
    }
  </style>
</head>

<body>
  <h1>Conway's Game of Life</h1>
  <p>Toque ou arraste para desenhar células.</p>

  <div id="stats" aria-live="polite">
    Células vivas: <span id="count">5</span>
  </div>

  <canvas
    id="grid"
    width="900"
    height="450"
    aria-label="Tabuleiro interativo do Game of Life"
  ></canvas>

  <div class="controls">
    <button id="randomize" type="button">Randomize</button>
    <button id="clear" type="button">Clear</button>
    <button id="glider" type="button">Reset glider</button>
  </div>

  <script>
    const canvas = document.getElementById("grid");
    const ctx = canvas.getContext("2d");
    const countDisplay = document.getElementById("count");

    const cellSize = 5;
    const gap = 2;
    const step = cellSize + gap;

    const columns = Math.floor(canvas.width / step);
    const rows = Math.floor(canvas.height / step);

    const cells = new Set();
    let drawing = false;
    let drawState = true;
    let lastCell = "";

    function key(x, y) {
      return `${x},${y}`;
    }

    function setCell(x, y, alive) {
      const id = key(x, y);

      if (alive) {
        cells.add(id);
      } else {
        cells.delete(id);
      }
    }

    function loadGlider() {
      cells.clear();

      const startX = Math.floor(columns / 2);
      const startY = Math.floor(rows / 2);

      [
        [1, 0],
        [2, 1],
        [0, 2],
        [1, 2],
        [2, 2]
      ].forEach(([x, y]) => {
        setCell(startX + x, startY + y, true);
      });

      render();
    }

    function render() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const id of cells) {
        const [x, y] = id.split(",").map(Number);

        ctx.fillStyle = (x + y) % 3 === 0
          ? "#ffc15a"
          : "#e9822b";

        ctx.fillRect(
          x * step,
          y * step,
          cellSize,
          cellSize
        );
      }

      countDisplay.textContent = cells.size;
    }

    function getCell(event) {
      const rect = canvas.getBoundingClientRect();

      const x = Math.floor(
        (event.clientX - rect.left) * canvas.width /
        rect.width / step
      );

      const y = Math.floor(
        (event.clientY - rect.top) * canvas.height /
        rect.height / step
      );

      if (x < 0 || x >= columns || y < 0 || y >= rows) {
        return null;
      }

      return { x, y };
    }

    function paint(event) {
      const cell = getCell(event);

      if (!cell) return;

      const id = key(cell.x, cell.y);

      if (id === lastCell) return;

      lastCell = id;
      setCell(cell.x, cell.y, drawState);
      render();
    }

    canvas.addEventListener("pointerdown", (event) => {
      const cell = getCell(event);

      if (!cell) return;

      event.preventDefault();

      const id = key(cell.x, cell.y);
      drawState = !cells.has(id);
      drawing = true;
      lastCell = "";

      canvas.setPointerCapture(event.pointerId);
      paint(event);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (drawing) paint(event);
    });

    function stopDrawing() {
      drawing = false;
      lastCell = "";
    }

    canvas.addEventListener("pointerup", stopDrawing);
    canvas.addEventListener("pointercancel", stopDrawing);

    document.getElementById("clear").addEventListener("click", () => {
      cells.clear();
      render();
    });

    document.getElementById("glider").addEventListener("click", loadGlider);

    document.getElementById("randomize").addEventListener("click", () => {
      cells.clear();

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < columns; x++) {
          if (Math.random() < 0.22) {
            setCell(x, y, true);
          }
        }
      }

      render();
    });

    loadGlider();
  </script>
</body>
</html>
